appId: com.dshdesktop.app
productName: DSH Studio
directories:
  output: dist
files:
  - main/**
  - renderer/**
  - package.json
extraResources:
  - from: vendor-src/dsh
    to: dsh
  - from: vendor-src/tools
    to: tools
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DSH Studio
  deleteAppDataOnUninstall: false
